<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleship</title>
<style>
  :root{
    --bg:#070d17; --panel:#0e1726; --panel-2:#131f33; --line:#22314b;
    --ink:#e7eef9; --dim:#8497b4; --accent:#3ddc97; --accent-2:#2f9bff;
    --hit:#ff5a5f; --miss:#41597f; --sunk:#8b1f2a; --ship:#3b4f6e; --warn:#ffc857;
    --cell:clamp(21px,3.4vw,30px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#123 0%,var(--bg) 60%) fixed;
    color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:26px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  input{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:11px 13px;font-size:15px;width:100%;font-family:inherit;
  }
  input:focus{outline:2px solid var(--accent-2);outline-offset:-1px}
  input.code{text-transform:uppercase;letter-spacing:.3em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;
    transition:background .12s,border-color .12s,transform .06s;
  }
  button:hover:not(:disabled){background:#1b2942;border-color:#334b70}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04221a}
  button.primary:hover:not(:disabled){background:#54e8a9;border-color:#54e8a9}
  button.ghost{background:transparent}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

  /* ---------------- boards ---------------- */
  .boards{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .board-wrap{position:relative}
  .board-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;min-height:22px}
  .board-name{font-weight:700;letter-spacing:.04em}
  .board-tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .board-tag.you{color:var(--accent)}
  .board-tag.turn{color:var(--warn)}
  .hp{display:flex;gap:2px;margin-left:auto}
  .hp i{width:5px;height:11px;border-radius:1px;background:#2a3b58;display:block}
  .hp i.gone{background:var(--hit)}

  .board{
    display:grid;grid-template-columns:18px repeat(10,var(--cell));
    grid-auto-rows:var(--cell);gap:2px;
    position:relative;z-index:1;
  }
  .board-overlay{
    position:absolute;inset:0;pointer-events:none;z-index:0;
    display:grid;grid-template-columns:18px repeat(10,var(--cell));
    grid-auto-rows:var(--cell);gap:2px;
  }
  .board .lbl{
    display:flex;align-items:center;justify-content:center;
    font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--dim);height:18px;
  }
  .board .lbl.row{height:var(--cell)}
  .cell{
    background:#12203a;border-radius:3px;position:relative;
    border:1px solid #1a2c4b;
  }
  .cell.clickable{cursor:crosshair}
  .cell.clickable:hover{background:#1d3358}
  .cell.clickable.ship:hover{background:rgba(255,255,255,.07)}
  .cell.ship{background:transparent;border-color:rgba(255,255,255,.08)}
  .ship-art-holder{position:relative;z-index:1;pointer-events:none}
  .ship-art{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .ship-art-holder.wreck{opacity:.62;filter:grayscale(.55) brightness(.7)}
  /* pegs and markers always sit on top of the hull, like the real board */
  .cell.hit,.cell.miss,.cell.sunk,.cell.erase-target,.cell.preview{z-index:2}
  .cell.miss::after{
    content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;
    border-radius:50%;background:var(--miss);
  }
  .cell.hit{background:transparent;border-color:rgba(255,90,95,.38)}
  .cell.hit::after{
    content:"";position:absolute;inset:25%;border-radius:50%;
    background:rgba(255,90,95,.72);
    box-shadow:0 0 0 1px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.45);
  }
  .cell.sunk{background:rgba(139,31,42,.28);border-color:rgba(192,48,60,.55)}
  .cell.sunk::after{
    content:"";position:absolute;inset:21%;border-radius:50%;
    background:rgba(214,46,58,.8);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.5);
  }
  .cell.spent{cursor:not-allowed}
  .cell.spent:hover{background:#12203a}
  .cell.aim{outline:2px solid var(--warn);outline-offset:-2px;z-index:2}
  .cell.erase-target{background:rgba(255,90,95,.8);border-color:#ff8a8d}
  .board.erasing .cell.clickable{cursor:pointer}
  .cell.clickable.erase-target:hover{background:rgba(255,90,95,.8);border-color:#ff8a8d}
  button.toggled{background:var(--hit);border-color:var(--hit);color:#fff}
  button.toggled:hover:not(:disabled){background:#ff7478;border-color:#ff7478}
  .cell.preview{background:#2b6e57;border-color:var(--accent)}
  .cell.preview.bad{background:#6e2b34;border-color:var(--hit)}
  .cell.last{box-shadow:0 0 0 2px var(--accent-2)}

  .board-wrap.dead .board{opacity:.4;filter:saturate(.5)}
  .board-box{position:relative}
  .xout{
    position:absolute;left:20px;right:0;top:20px;bottom:0;pointer-events:none;opacity:.8;z-index:3;
    background:
      linear-gradient(to bottom right,transparent calc(50% - 2px),var(--hit) 50%,transparent calc(50% + 2px)),
      linear-gradient(to bottom left, transparent calc(50% - 2px),var(--hit) 50%,transparent calc(50% + 2px));
  }
  .board-wrap.mine .cell{cursor:default}

  /* ---------------- fleet / roster / log ---------------- */
  .fleet{display:flex;flex-direction:column;gap:6px}
  .ship-row{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
    border:1px solid transparent;background:var(--panel-2);cursor:pointer;
  }
  .ship-row.active{border-color:var(--accent);background:#14322a}
  .ship-row.done{opacity:.55}
  .ship-row .pips{margin-left:auto;height:17px}
  .ship-row .pips svg{display:block;width:100%;height:100%}

  .roster{display:flex;flex-direction:column;gap:7px}
  .who{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--panel-2);border-radius:9px}
  .dot{width:9px;height:9px;border-radius:50%;background:#3d4f6d;flex:none}
  .dot.ok{background:var(--accent)}
  .who .tag{margin-left:auto;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .seatnum{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--dim);
           border:1px solid var(--line);border-radius:5px;padding:3px 5px}

  .log{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:2px;
       font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
  .log div{padding:3px 0;border-bottom:1px solid #16233a;color:var(--dim)}
  .log b{color:var(--ink);font-weight:600}
  .log .h{color:var(--hit)}
  .log .s{color:var(--warn)}

  .code-pill{
    font:700 20px/1 ui-monospace,Menlo,monospace;letter-spacing:.28em;
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:11px 8px 11px 16px;cursor:pointer;user-select:all;
  }
  .banner{
    border-radius:12px;padding:14px 16px;font-weight:700;letter-spacing:.03em;
    border:1px solid var(--line);background:var(--panel-2);
  }
  .banner.win{background:#0f3a2c;border-color:var(--accent);color:var(--accent)}
  .banner.lose{background:#3a1218;border-color:var(--hit);color:#ff9fa2}
  .banner.turn{background:#3a2f0f;border-color:var(--warn);color:var(--warn)}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
    background:var(--hit);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;
    transition:transform .22s cubic-bezier(.2,.9,.3,1.3);z-index:50;max-width:90vw;
  }
  #toast.show{transform:translateX(-50%) translateY(0)}
  .muted{color:var(--dim);font-size:13px}
  .hint{color:var(--dim);font-size:12.5px;line-height:1.6}
  kbd{background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:5px;padding:1px 6px;font:600 11px/1.6 ui-monospace,Menlo,monospace}
  .side{width:min(300px,100%);flex:none}
  @media (max-width:820px){ .side{width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Battle<span>ship</span></h1>
      <div class="sub" id="subtitle">2 or 3 players &middot; one shot hits every enemy at once</div>
    </div>
    <div id="header-right" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://eexzhpmxcrjqbhvqogkw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IxezLk-Of7Hl0K4NMfUpKg_9iLIh5t_';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false },
  realtime: { params: { eventsPerSecond: 12 } },
});

/* ------------------------------------------------------------------ model */

const N = 10;
const FLEET = [
  { n: 'Carrier',    l: 5 },
  { n: 'Battleship', l: 4 },
  { n: 'Cruiser',    l: 3 },
  { n: 'Submarine',  l: 3 },
  { n: 'Destroyer',  l: 2 },
];
const TOTAL_CELLS = FLEET.reduce((a, s) => a + s.l, 0); // 17
const LETTERS = 'ABCDEFGHIJ';
const xy = (x, y) => `${x},${y}`;
const label = (x, y) => `${LETTERS[x]}${y + 1}`;

const S = {
  session: null,          // {code, token, seat, name}
  state: null,            // {room, players, shots, me}
  place: { ships: [], dir: 'h', idx: 0, erase: false },
  hover: null,
  busy: false,
  channel: null,
  poll: null,
};

const SKEY = 'battleship.session.v1';
const loadSession = () => { try { return JSON.parse(localStorage.getItem(SKEY)); } catch { return null; } };
const saveSession = s => { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch {} };
const dropSession = () => { try { localStorage.removeItem(SKEY); } catch {} };
const lastName   = () => { try { return localStorage.getItem('battleship.name') || ''; } catch { return ''; } };
const rememberName = n => { try { localStorage.setItem('battleship.name', n); } catch {} };

// file:// origins reject replaceState in some browsers; the URL is a nicety, not a requirement.
function setRoomInUrl(code) {
  try { history.replaceState({}, '', location.pathname + (code ? '?room=' + code : '')); } catch {}
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message.replace(/^.*?:\s*/, '') || 'Request failed');
  return data;
}

/* ----------------------------------------------------- ship geometry (ui) */

function cellsOf(ship) {
  const out = [];
  for (let i = 0; i < ship.l; i++)
    out.push(ship.d === 'h' ? xy(ship.x + i, ship.y) : xy(ship.x, ship.y + i));
  return out;
}
function shipAt(key) {
  return S.place.ships.find(s => cellsOf(s).includes(key));
}
function fits(ship, others) {
  const taken = new Set(others.flatMap(cellsOf));
  for (let i = 0; i < ship.l; i++) {
    const x = ship.d === 'h' ? ship.x + i : ship.x;
    const y = ship.d === 'h' ? ship.y : ship.y + i;
    if (x < 0 || x >= N || y < 0 || y >= N) return false;
    if (taken.has(xy(x, y))) return false;
  }
  return true;
}
function randomFleet() {
  const out = [];
  for (const spec of FLEET) {
    for (let guard = 0; guard < 4000; guard++) {
      const d = Math.random() < 0.5 ? 'h' : 'v';
      const ship = {
        n: spec.n, l: spec.l, d,
        x: Math.floor(Math.random() * (d === 'h' ? N - spec.l + 1 : N)),
        y: Math.floor(Math.random() * (d === 'v' ? N - spec.l + 1 : N)),
      };
      if (fits(ship, out)) { out.push(ship); break; }
    }
  }
  return out.length === FLEET.length ? out : randomFleet();
}

/* ------------------------------------------------------------- ship artwork */
// Each hull is drawn horizontally in a 100-per-cell viewBox, bow to the right,
// then rotated as one group for vertical placement.

const SHIP_ART = {
  Carrier:    { hull: '#5e7c9b', deck: '#8199b4', trim: '#36506e' },
  Battleship: { hull: '#86758f', deck: '#a596ad', trim: '#544862' },
  Cruiser:    { hull: '#4e8a86', deck: '#71a8a4', trim: '#2c5b58' },
  Submarine:  { hull: '#7d7350', deck: '#9c9169', trim: '#4e4731' },
  Destroyer:  { hull: '#8d6a6a', deck: '#ab8888', trim: '#5c4242' },
};

const hullPath = W =>
  `M12,22 L${W - 48},22 C${W - 22},30 ${W - 9},43 ${W - 5},50 ` +
  `C${W - 9},57 ${W - 22},70 ${W - 48},78 L12,78 C3,68 3,32 12,22 Z`;

function shipArt(n, l) {
  const W = l * 100;
  const c = SHIP_ART[n] || SHIP_ART.Cruiser;
  let hull = `<path d="${hullPath(W)}" fill="${c.hull}"/>`;
  let sup = '';

  if (n === 'Carrier') {
    // flat flight deck running the whole length, island offset to one side
    sup = `<rect x="20" y="28" width="${W - 78}" height="44" rx="6" fill="${c.deck}"/>
      <rect x="34" y="47" width="${W - 108}" height="6" rx="3" fill="${c.trim}" opacity=".5"/>
      <rect x="${W * 0.56}" y="12" width="36" height="24" rx="5" fill="${c.trim}"/>
      <rect x="${W * 0.56 + 10}" y="0" width="6" height="14" rx="2" fill="${c.trim}"/>`;
  } else if (n === 'Battleship') {
    // two gun turrets with barrels, tall bridge and mast
    sup = `<rect x="${W * 0.36}" y="22" width="56" height="56" rx="8" fill="${c.deck}"/>
      <rect x="${W * 0.36 + 22}" y="3" width="8" height="21" rx="2" fill="${c.trim}"/>
      <g fill="${c.trim}">
        <rect x="${W * 0.13}" y="31" width="36" height="38" rx="9"/>
        <rect x="${W * 0.13 + 32}" y="46" width="28" height="8" rx="4"/>
        <rect x="${W * 0.64}" y="31" width="36" height="38" rx="9"/>
        <rect x="${W * 0.64 + 32}" y="46" width="28" height="8" rx="4"/>
      </g>`;
  } else if (n === 'Cruiser') {
    // single tall funnel amidships, one forward turret
    sup = `<rect x="${W * 0.30}" y="24" width="44" height="52" rx="7" fill="${c.deck}"/>
      <rect x="${W * 0.53}" y="11" width="21" height="37" rx="5" fill="${c.trim}"/>
      <rect x="${W * 0.14}" y="34" width="28" height="32" rx="7" fill="${c.trim}"/>
      <rect x="${W * 0.14 + 24}" y="46" width="22" height="7" rx="3.5" fill="${c.trim}"/>`;
  } else if (n === 'Submarine') {
    // rounded cigar hull, conning tower and periscope, waterline stripe
    hull = `<rect x="7" y="26" width="${W - 14}" height="48" rx="24" fill="${c.hull}"/>`;
    sup = `<rect x="${W * 0.36}" y="7" width="48" height="29" rx="9" fill="${c.deck}"/>
      <rect x="${W * 0.36 + 21}" y="0" width="5" height="10" rx="2" fill="${c.trim}"/>
      <rect x="16" y="47" width="${W - 32}" height="7" rx="3.5" fill="${c.trim}" opacity=".42"/>`;
  } else {
    // Destroyer: compact and sharp, one funnel, one turret
    sup = `<rect x="${W * 0.33}" y="25" width="38" height="50" rx="6" fill="${c.deck}"/>
      <rect x="${W * 0.33 + 44}" y="15" width="17" height="33" rx="4" fill="${c.trim}"/>
      <rect x="${W * 0.11}" y="36" width="26" height="28" rx="6" fill="${c.trim}"/>`;
  }
  return hull + sup;
}

function shipSvg(n, l, d) {
  const W = l * 100;
  const art = shipArt(n, l);
  const box = d === 'h' ? `0 0 ${W} 100` : `0 0 100 ${W}`;
  const body = d === 'h' ? art : `<g transform="translate(100,0) rotate(90)">${art}</g>`;
  return `<svg class="ship-art" viewBox="${box}" preserveAspectRatio="none">${body}</svg>`;
}

// Ships are laid over the grid as grid items, so they line up automatically
// and run continuously across the gaps between cells.
function addShipArt(board, ship, cls) {
  const holder = el('div', 'ship-art-holder' + (cls ? ' ' + cls : ''));
  holder.style.gridColumn = ship.d === 'h' ? `${ship.x + 2} / span ${ship.l}` : `${ship.x + 2}`;
  holder.style.gridRow    = ship.d === 'h' ? `${ship.y + 2}` : `${ship.y + 2} / span ${ship.l}`;
  holder.innerHTML = shipSvg(ship.n, ship.l, ship.d);
  board.append(holder);
}

/* -------------------------------------------------------- derived helpers */

// cell -> 'hit' | 'miss' | 'sunk', for the board belonging to `seat`
function marksFor(seat) {
  const m = new Map();
  for (const shot of S.state.shots) {
    for (const r of shot.results || []) {
      if (r.seat !== seat) continue;
      m.set(xy(shot.x, shot.y), r.hit ? 'hit' : 'miss');
      if (r.sunk && Array.isArray(r.cells)) for (const c of r.cells) m.set(c, 'sunk');
    }
  }
  return m;
}
// A sunk ship's cells come back in the shot result, so we can reveal its shape.
function sunkShipsFor(seat) {
  const seen = new Set(), out = [];
  for (const shot of S.state.shots) {
    for (const r of shot.results || []) {
      if (r.seat !== seat || !r.sunk || !Array.isArray(r.cells) || seen.has(r.sunk)) continue;
      seen.add(r.sunk);
      const pts = r.cells.map(c => c.split(',').map(Number));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      out.push({
        n: r.sunk, l: r.cells.length,
        x: Math.min(...xs), y: Math.min(...ys),
        d: new Set(ys).size === 1 ? 'h' : 'v',
      });
    }
  }
  return out;
}

function myFiredCells() {
  const s = new Set();
  const seat = S.state.me?.seat;
  for (const shot of S.state.shots) if (shot.shooter === seat) s.add(xy(shot.x, shot.y));
  return s;
}
const lastShot = () => S.state.shots[S.state.shots.length - 1] || null;
const playerAt = seat => S.state.players.find(p => p.seat === seat);
const myTurn = () => {
  const st = S.state;
  return st.room.status === 'playing' && st.me && st.me.alive && st.room.turn_seat === st.me.seat;
};

/* ------------------------------------------------------------- rendering */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/**
 * opts: { seat, title, tag, tagClass, mine, dead, marks, ships, interactive,
 *         preview:Set, previewBad:bool, hp:[done,total] }
 */
function renderBoard(opts) {
  const wrap = el('div', 'board-wrap' + (opts.mine ? ' mine' : '') + (opts.dead ? ' dead' : ''));

  const head = el('div', 'board-head');
  head.append(el('span', 'board-name', opts.title));
  if (opts.tag) head.append(el('span', 'board-tag ' + (opts.tagClass || ''), opts.tag));
  if (opts.hp) {
    const hp = el('div', 'hp');
    for (let i = 0; i < opts.hp[1]; i++) {
      const pip = el('i');
      if (i < opts.hp[0]) pip.classList.add('gone');
      hp.append(pip);
    }
    head.append(hp);
  }
  wrap.append(head);

  const board = el('div', 'board');
  board.append(el('div', 'lbl'));
  for (let x = 0; x < N; x++) board.append(el('div', 'lbl', LETTERS[x]));

  const shipCells = new Set((opts.ships || []).flatMap(cellsOf));
  const last = lastShot();

  for (let y = 0; y < N; y++) {
    board.append(el('div', 'lbl row', String(y + 1)));
    for (let x = 0; x < N; x++) {
      const key = xy(x, y);
      const c = el('div', 'cell');
      c.dataset.xy = key;
      if (!opts.mine) c.dataset.enemy = '1';

      if (shipCells.has(key)) c.classList.add('ship');
      const mark = opts.marks?.get(key);
      if (mark) c.classList.add(mark);

      if (opts.preview?.has(key)) {
        c.classList.add('preview');
        if (opts.previewBad) c.classList.add('bad');
      }
      if (last && !opts.mine && last.x === x && last.y === y &&
          (last.results || []).some(r => r.seat === opts.seat)) c.classList.add('last');
      if (last && opts.mine && last.x === x && last.y === y &&
          (last.results || []).some(r => r.seat === S.state?.me?.seat)) c.classList.add('last');

      if (opts.interactive) {
        if (opts.spent?.has(key)) c.classList.add('spent');
        else c.classList.add('clickable');
      }
      board.append(c);
    }
  }
  const box = el('div', 'board-box');
  const fleet = opts.ships || [], wrecks = opts.wrecks || [];
  if (fleet.length || wrecks.length) {
    const layer = el('div', 'board-overlay');
    for (const s of fleet)  addShipArt(layer, s);
    for (const s of wrecks) addShipArt(layer, s, 'wreck');
    box.append(layer);
  }
  box.append(board);
  if (opts.dead) box.append(el('div', 'xout'));
  wrap.append(box);
  return wrap;
}

function updatePreview(key) {
  document.querySelectorAll('.cell.preview, .cell.erase-target')
    .forEach(c => c.classList.remove('preview', 'bad', 'erase-target'));
  if (!key || S.state?.me?.ready) return;

  if (S.place.erase) {
    const ship = shipAt(key);
    if (!ship) return;
    for (const c of cellsOf(ship)) {
      const node = document.querySelector(`.board-wrap.mine .cell[data-xy="${c}"]`);
      if (node) node.classList.add('erase-target');
    }
    return;
  }

  const spec = FLEET[S.place.idx];
  if (!spec) return;
  const [hx, hy] = key.split(',').map(Number);
  const ghost = { ...spec, x: hx, y: hy, d: S.place.dir };
  const bad = !fits(ghost, S.place.ships);
  for (const c of cellsOf(ghost)) {
    const node = document.querySelector(`.board-wrap.mine .cell[data-xy="${c}"]`);
    if (node) { node.classList.add('preview'); if (bad) node.classList.add('bad'); }
  }
}

function highlightAim(key) {
  document.querySelectorAll('.cell.aim').forEach(c => c.classList.remove('aim'));
  if (!key) return;
  document.querySelectorAll(`.cell[data-enemy][data-xy="${key}"]`)
    .forEach(c => c.classList.add('aim'));
}

/* ------------------------------------------------------------- log lines */

function logLines() {
  const out = [];
  for (const shot of S.state.shots) {
    const who = playerAt(shot.shooter)?.name ?? `Seat ${shot.shooter + 1}`;
    const line = el('div');
    line.append(el('b', null, who), document.createTextNode(` fired ${label(shot.x, shot.y)} `));
    const rs = shot.results || [];
    if (!rs.length) line.append(document.createTextNode('— no targets'));
    rs.forEach((r, i) => {
      if (i) line.append(document.createTextNode('  ·  '));
      else line.append(document.createTextNode('→ '));
      line.append(document.createTextNode(r.name + ' '));
      if (r.hit) {
        line.append(el('span', 'h', 'HIT'));
        if (r.sunk) line.append(el('span', 's', ` — sank the ${r.sunk}!`));
        if (r.dead) line.append(el('span', 's', ' — FLEET DESTROYED'));
      } else {
        line.append(document.createTextNode('miss'));
      }
    });
    out.push(line);
  }
  return out;
}

/* ------------------------------------------------------------- the views */

function render() {
  const app = document.getElementById('app');
  const hdr = document.getElementById('header-right');
  app.replaceChildren();
  hdr.replaceChildren();

  if (!S.session || !S.state) { renderHome(app); return; }

  const { room } = S.state;

  const pill = el('div', 'code-pill', room.code);
  pill.title = 'Click to copy the invite link';
  pill.onclick = async () => {
    const url = location.origin + location.pathname + '?room=' + room.code;
    try {
      await navigator.clipboard.writeText(url);
      toast('Invite link copied');
    } catch {
      toast('Room code: ' + room.code);
    }
  };
  const leave = el('button', 'ghost', 'Leave');
  leave.onclick = () => { teardown(); dropSession(); S.session = null; S.state = null; setRoomInUrl(null); render(); };
  hdr.append(pill, leave);

  if (room.status === 'lobby') { renderLobby(app); updatePreview(S.hover); }
  else renderGame(app);
}

function renderHome(app) {
  const name0 = lastName();
  const preset = new URLSearchParams(location.search).get('room') || '';

  const card = el('div', 'card stack');
  card.style.maxWidth = '440px';

  const nameWrap = el('div');
  nameWrap.append(el('label', null, 'Your name'));
  const name = el('input');
  name.placeholder = 'Captain';
  name.maxLength = 16;
  name.value = name0;
  nameWrap.append(name);
  card.append(nameWrap);

  card.append(el('div', 'muted', 'Start a new game'));
  const mk = el('div', 'row');
  const b2 = el('button', 'primary', '2 players');
  const b3 = el('button', 'primary', '3 players');
  mk.append(b2, b3);
  card.append(mk);

  card.append(el('div', 'muted', 'or join with a code'));
  const joinWrap = el('div', 'row');
  const code = el('input', 'code');
  code.placeholder = 'ABCD';
  code.maxLength = 4;
  code.value = preset;
  code.style.flex = '1';
  const bj = el('button', null, 'Join');
  joinWrap.append(code, bj);
  card.append(joinWrap);

  card.append(el('div', 'hint',
    '3-player rule: you pick one square and it is fired at BOTH opponents at once. ' +
    'Knock one fleet out and the last two fight it out one-on-one.'));

  const go = async (fn, args) => {
    const n = name.value.trim();
    if (!n) { toast('Enter a name first'); name.focus(); return; }
    rememberName(n);
    try {
      lockButtons(card, true);
      const res = await rpc(fn, { ...args, p_name: n });
      S.session = { code: res.code, token: res.token, seat: res.seat, name: res.name };
      saveSession(S.session);
      setRoomInUrl(res.code);
      await refresh();
      subscribe();
    } catch (e) { toast(e.message); }
    finally { lockButtons(card, false); }
  };

  b2.onclick = () => go('create_room', { p_max: 2 });
  b3.onclick = () => go('create_room', { p_max: 3 });
  bj.onclick = () => {
    const c = code.value.trim().toUpperCase();
    if (c.length !== 4) { toast('Room codes are 4 characters'); return; }
    go('join_room', { p_code: c });
  };
  code.onkeydown = e => { if (e.key === 'Enter') bj.click(); };
  name.onkeydown = e => { if (e.key === 'Enter') (code.value ? bj : b2).click(); };

  app.append(card);
  (name0 ? (preset ? bj : code) : name).focus?.();
}

function lockButtons(root, on) {
  root.querySelectorAll('button').forEach(b => { b.disabled = on; });
}

/* ----------------------------------------------------------------- lobby */

function renderLobby(app) {
  const { room, players, me } = S.state;
  const locked = !!me?.ready;

  const cols = el('div', 'row');
  cols.style.alignItems = 'flex-start';

  /* --- placement board --- */
  const left = el('div', 'card stack');

  const waiting = players.length < room.max_players;
  const head = el('div');
  head.append(el('div', 'board-name', locked ? 'Fleet locked in' : 'Position your fleet'));
  head.append(el('div', 'muted',
    locked
      ? (waiting ? `Waiting for ${room.max_players - players.length} more player(s)…`
                 : 'Waiting for the others to finish placing…')
      : 'Click the grid to drop the highlighted ship.'));
  left.append(head);

  const ships = locked ? (me?.ships || []) : S.place.ships;

  const board = renderBoard({
    seat: me?.seat, title: (me?.name || 'You') + "'s waters", tag: 'you', tagClass: 'you',
    mine: true, ships,
  });

  if (!locked) {
    if (S.place.erase) board.querySelector('.board').classList.add('erasing');
    board.querySelectorAll('.cell').forEach(c => {
      if (!S.place.erase || shipAt(c.dataset.xy)) c.classList.add('clickable');
      c.onmouseenter = () => { S.hover = c.dataset.xy; updatePreview(S.hover); };
      c.onclick = () => (S.place.erase ? eraseAt : placeAt)(c.dataset.xy);
      c.oncontextmenu = e => { e.preventDefault(); rotate(); };
    });
    board.querySelector('.board').onmouseleave = () => { S.hover = null; updatePreview(null); };
  }
  left.append(board);

  if (!locked) {
    const fleet = el('div', 'fleet');
    FLEET.forEach((s, i) => {
      const placed = S.place.ships.find(p => p.n === s.n);
      const row = el('div', 'ship-row' + (i === S.place.idx ? ' active' : '') + (placed ? ' done' : ''));
      row.append(el('span', null, s.n));
      if (placed) row.append(el('span', 'muted', `· ${label(placed.x, placed.y)} ${placed.d === 'h' ? '→' : '↓'}`));
      const pips = el('div', 'pips');
      pips.style.width = (s.l * 17) + 'px';
      pips.innerHTML = shipSvg(s.n, s.l, 'h');
      row.append(pips);
      row.onclick = () => {
        S.place.ships = S.place.ships.filter(p => p.n !== s.n);
        S.place.idx = i;
        render();
      };
      fleet.append(row);
    });
    left.append(fleet);

    const controls = el('div', 'row');
    const rot = el('button', null, `Rotate (${S.place.dir === 'h' ? 'horizontal' : 'vertical'})`);
    rot.onclick = rotate;
    const rnd = el('button', null, 'Random');
    rnd.onclick = () => { S.place.ships = randomFleet(); S.place.idx = FLEET.length; S.place.erase = false; render(); };
    const ers = el('button', S.place.erase ? 'toggled' : null, S.place.erase ? 'Erasing…' : 'Erase');
    ers.disabled = !S.place.ships.length;
    ers.onclick = () => { S.place.erase = !S.place.erase; S.hover = null; render(); };
    const clr = el('button', 'ghost', 'Clear all');
    clr.disabled = !S.place.ships.length;
    clr.onclick = () => { S.place.ships = []; S.place.idx = 0; S.place.erase = false; render(); };
    const lock = el('button', 'primary', 'Lock in fleet');
    lock.disabled = S.place.ships.length !== FLEET.length || S.busy;
    lock.onclick = lockFleet;
    controls.append(rot, rnd, ers, clr, lock);
    left.append(controls);
    left.append(el('div', 'hint', S.place.erase
      ? 'Erase mode: click any ship on the grid to remove it. Press E or click Erase again to stop.'
      : 'Right-click or press R to rotate · press E or hit Erase to remove a single ship · or click a ship in the list'));
  } else {
    const un = el('button', 'ghost', 'Rearrange fleet');
    un.onclick = async () => {
      S.place.ships = (me?.ships || []).map(s => ({ ...s }));
      S.place.idx = FLEET.length;
      try { await rpc('unready', { p_token: S.session.token }); await refresh(); }
      catch (e) { toast(e.message); }
    };
    const unRow = el('div', 'row'); unRow.append(un); left.append(unRow);
  }

  /* --- roster --- */
  const right = el('div', 'card stack side');
  right.append(el('div', 'board-name', `Crew · ${players.length}/${room.max_players}`));
  const roster = el('div', 'roster');
  for (let seat = 0; seat < room.max_players; seat++) {
    const p = players.find(q => q.seat === seat);
    const w = el('div', 'who');
    w.append(el('span', 'seatnum', 'P' + (seat + 1)));
    w.append(el('span', 'dot' + (p?.ready ? ' ok' : '')));
    w.append(el('span', null, p ? p.name : 'empty seat'));
    if (p && me && p.seat === me.seat) w.append(el('span', 'tag', 'you'));
    else if (p) w.append(el('span', 'tag', p.ready ? 'ready' : 'placing'));
    else w.append(el('span', 'tag', 'waiting'));
    roster.append(w);
  }
  right.append(roster);
  right.append(el('div', 'hint',
    `Share the code ${room.code} (or the copied link) with your opponent${room.max_players > 2 ? 's' : ''}. ` +
    `The game starts the moment all ${room.max_players} fleets are locked in.`));
  if (room.max_players === 3)
    right.append(el('div', 'hint',
      'Reminder: every shot you fire lands on both enemy boards at the same square.'));

  cols.append(left, right);
  app.append(cols);
}

function eraseAt(key) {
  const ship = shipAt(key);
  if (!ship) { toast('No ship on that square'); return; }
  S.place.ships = S.place.ships.filter(p => p.n !== ship.n);
  S.place.idx = FLEET.findIndex(f => f.n === ship.n);
  if (!S.place.ships.length) S.place.erase = false;   // nothing left to erase
  S.hover = null;
  render();
}

function placeAt(key) {
  const spec = FLEET[S.place.idx];
  if (!spec) return;
  const [x, y] = key.split(',').map(Number);
  const ship = { n: spec.n, l: spec.l, x, y, d: S.place.dir };
  if (!fits(ship, S.place.ships)) { toast("That won't fit there"); return; }
  S.place.ships.push(ship);
  S.place.ships.sort((a, b) => FLEET.findIndex(f => f.n === a.n) - FLEET.findIndex(f => f.n === b.n));
  const next = FLEET.findIndex(f => !S.place.ships.some(p => p.n === f.n));
  S.place.idx = next === -1 ? FLEET.length : next;
  S.hover = null;
  render();
}

async function lockFleet() {
  const ordered = FLEET.map(f => S.place.ships.find(p => p.n === f.n));
  if (ordered.some(s => !s)) { toast('Place every ship first'); return; }
  S.busy = true; render();
  try {
    await rpc('place_ships', { p_token: S.session.token, p_ships: ordered });
    await refresh();
  } catch (e) { toast(e.message); }
  finally { S.busy = false; render(); }
}

function rotate() {
  S.place.dir = S.place.dir === 'h' ? 'v' : 'h';
  render();
}

/* ------------------------------------------------------------------ game */

function renderGame(app) {
  const { room, players, me } = S.state;
  const finished = room.status === 'finished';
  const winner = finished ? playerAt(room.winner_seat) : null;
  const mine = me ? marksFor(me.seat) : new Map();
  const spent = myFiredCells();

  /* banner */
  if (finished) {
    const iWon = me && room.winner_seat === me.seat;
    app.append(el('div', 'banner ' + (iWon ? 'win' : 'lose'),
      iWon ? '★  You win — last fleet afloat.'
           : `${winner ? winner.name : 'Nobody'} wins this one.`));
  } else if (myTurn()) {
    const enemies = players.filter(p => p.alive && p.seat !== me.seat).length;
    app.append(el('div', 'banner turn',
      enemies > 1
        ? '▶  Your turn — pick one square; it hits both enemy boards.'
        : '▶  Your turn — pick a square.'));
  } else if (me && !me.alive) {
    app.append(el('div', 'banner lose', 'Your fleet is gone. Watching the rest play out.'));
  } else {
    const t = playerAt(room.turn_seat);
    app.append(el('div', 'banner', `Waiting for ${t ? t.name : 'the next player'}…`));
  }
  const spacer = el('div'); spacer.style.height = '14px'; app.append(spacer);

  const cols = el('div', 'row');
  cols.style.alignItems = 'flex-start';

  const boards = el('div', 'boards');

  /* your own waters */
  boards.append(renderBoard({
    seat: me?.seat,
    title: (me?.name || 'You') + "'s waters",
    tag: me && !me.alive ? 'sunk' : 'you',
    tagClass: me && !me.alive ? '' : 'you',
    mine: true,
    dead: me ? !me.alive : false,
    ships: me?.ships || [],
    marks: mine,
    hp: [playerAt(me?.seat)?.hits_taken ?? 0, TOTAL_CELLS],
  }));

  /* one board per opponent */
  const enemies = players.filter(p => !me || p.seat !== me.seat).sort((a, b) => a.seat - b.seat);
  for (const p of enemies) {
    const interactive = myTurn() && p.alive;
    const bw = renderBoard({
      seat: p.seat,
      title: p.name,
      tag: !p.alive ? 'eliminated' : (room.turn_seat === p.seat && !finished ? 'their turn' : `P${p.seat + 1}`),
      tagClass: room.turn_seat === p.seat && p.alive && !finished ? 'turn' : '',
      dead: !p.alive,
      marks: marksFor(p.seat),
      wrecks: sunkShipsFor(p.seat),
      interactive, spent,
      hp: [p.hits_taken, TOTAL_CELLS],
    });
    if (interactive) {
      bw.querySelectorAll('.cell.clickable').forEach(c => {
        c.onmouseenter = () => highlightAim(c.dataset.xy);
        c.onmouseleave = () => highlightAim(null);
        c.onclick = () => shoot(c.dataset.xy);
      });
    }
    boards.append(bw);
  }

  const boardCard = el('div', 'card stack');
  boardCard.append(boards);
  if (myTurn() && players.filter(p => p.alive && p.seat !== me.seat).length > 1)
    boardCard.append(el('div', 'hint',
      'Hover a square to see where it lands on every enemy board — one click fires at all of them.'));
  if (finished) {
    const again = el('button', 'primary', 'Rematch (same room)');
    again.onclick = async () => {
      try { await rpc('rematch', { p_token: S.session.token }); S.place = { ships: [], dir: 'h', idx: 0 }; await refresh(); }
      catch (e) { toast(e.message); }
    };
    const againRow = el('div', 'row'); againRow.append(again); boardCard.append(againRow);
  }

  /* side: scores + log */
  const side = el('div', 'card stack side');
  side.append(el('div', 'board-name', 'Fleet status'));
  const roster = el('div', 'roster');
  for (const p of [...players].sort((a, b) => a.seat - b.seat)) {
    const w = el('div', 'who');
    w.append(el('span', 'seatnum', 'P' + (p.seat + 1)));
    w.append(el('span', 'dot' + (p.alive ? ' ok' : '')));
    w.append(el('span', null, p.name + (me && p.seat === me.seat ? ' (you)' : '')));
    w.append(el('span', 'tag', p.alive ? `${p.hits_taken}/${TOTAL_CELLS} hit` : 'destroyed'));
    roster.append(w);
  }
  side.append(roster);
  side.append(el('div', 'board-name', 'Action log'));
  const log = el('div', 'log');
  const lines = logLines();
  if (!lines.length) log.append(el('div', null, 'No shots fired yet.'));
  else log.append(...lines.reverse());
  side.append(log);

  cols.append(boardCard, side);
  app.append(cols);
}

async function shoot(key) {
  if (S.busy || !myTurn()) return;
  const [x, y] = key.split(',').map(Number);
  S.busy = true;
  highlightAim(null);
  try {
    await rpc('fire', { p_token: S.session.token, p_x: x, p_y: y });
    await refresh();
  } catch (e) { toast(e.message); await refresh(); }
  finally { S.busy = false; }
}

/* ----------------------------------------------------------- sync plumbing */

let refreshing = false, refreshAgain = false;
async function refresh() {
  if (!S.session) return;
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  try {
    const data = await rpc('get_state', { p_code: S.session.code, p_token: S.session.token });
    if (!data.me) { toast('Your seat in that room is gone.'); dropSession(); S.session = null; S.state = null; teardown(); render(); return; }
    S.state = data;
    // keep the local placement editor in step with the server
    if (data.room.status === 'lobby' && S.place.ships.length === 0 && (data.me.ships || []).length) {
      S.place.ships = (data.me.ships || []).map(s => ({ ...s }));
    }
    render();
  } catch (e) {
    toast(e.message);
    if (/Room not found/i.test(e.message)) { dropSession(); S.session = null; S.state = null; teardown(); render(); }
  } finally {
    refreshing = false;
    if (refreshAgain) { refreshAgain = false; refresh(); }
  }
}

function subscribe() {
  teardown();
  const code = S.session.code;
  S.channel = sb.channel(`room:${code}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'shots',   filter: `room_code=eq.${code}` }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `room_code=eq.${code}` }, refresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms',   filter: `code=eq.${code}` },      refresh)
    .subscribe();
  // Belt and braces: poll in case Realtime is unavailable on the project.
  S.poll = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 3000);
}
function teardown() {
  if (S.channel) { sb.removeChannel(S.channel); S.channel = null; }
  if (S.poll) { clearInterval(S.poll); S.poll = null; }
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (S.state?.room.status !== 'lobby' || S.state.me?.ready) return;
  if (e.key === 'r' || e.key === 'R') rotate();
  if (e.key === 'e' || e.key === 'E') {
    if (S.place.ships.length) { S.place.erase = !S.place.erase; S.hover = null; render(); }
  }
});
window.addEventListener('beforeunload', teardown);

/* ------------------------------------------------------------------ boot */

(async function boot() {
  const urlRoom = new URLSearchParams(location.search).get('room');
  const saved = loadSession();
  if (saved && (!urlRoom || urlRoom.toUpperCase() === saved.code)) {
    S.session = saved;
    await refresh();
    if (S.session) subscribe();
  }
  render();
})();
</script>
